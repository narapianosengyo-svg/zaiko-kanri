<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>乾燥剤 在庫管理</title>
  <style>
    :root{
      --bg:#0b0d12; --card:#121623; --text:#e8ecff; --muted:#aab3d6;
      --line:#26304a; --accent:#7aa2ff; --danger:#ff6b6b; --ok:#4dd4ac; --input:#0f1320;
    }
    body{margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
  background: radial-gradient(1200px 800px at 20% 0%, #162044 0%, var(--bg) 55%);
  color:var(--text);}
    .wrap{ max-width:1150px; margin:28px auto; padding:0 14px; }
    header{ display:flex; gap:14px; align-items:flex-start; justify-content:space-between; margin-bottom:14px; }
    h1{ margin:0; font-size:22px; letter-spacing:.02em; }
    .sub{ margin:6px 0 0; color:var(--muted); font-size:13px; line-height:1.5; }
    .card{background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02)); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:14px; box-shadow: 0 10px 30px rgba(0,0,0,.28); }
    .left, .right{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    label{ font-size:12px; color:var(--muted); display:flex; gap:8px; align-items:center; }
    input[type="number"], input[type="text"], input[type="date"], select{
      background:var(--input); border:1px solid rgba(255,255,255,.10); color:var(--text);
      border-radius:10px; padding:9px 10px; outline:none; min-width:140px;
    }
    input[type="number"]{ min-width:110px; }
    input:focus, select:focus{ border-color: rgba(122,162,255,.55); box-shadow: 0 0 0 3px rgba(122,162,255,.18); }
    button{ border:1px solid rgba(255,255,255,.12); background: rgba(122,162,255,.16);
      color:var(--text); padding:10px 12px; border-radius:12px; cursor:pointer; font-weight:600; }
    button:hover{ background: rgba(122,162,255,.24); }
    .btn-danger{ background: rgba(255,107,107,.14); }
    .btn-danger:hover{ background: rgba(255,107,107,.22); }
    .btn-ghost{ background: transparent; }
    .btn-ghost:hover{ background: rgba(255,255,255,.06); }

    .grid{ display:grid; grid-template-columns:1fr; gap:12px; }
    @media (min-width: 900px){ .grid{ grid-template-columns: 1.2fr .8fr; align-items:start; } }

    .summary{ display:flex; flex-wrap:wrap; gap:12px; align-items:stretch; }
    .pill{ flex:1; min-width:220px; background: rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:12px; }
    .pill .k{ color:var(--muted); font-size:12px; }
    .pill .v{ font-size:20px; margin-top:6px; font-weight:800; letter-spacing:.02em; }
    .pill .v.ok{ color: var(--ok); } .pill .v.warn{ color: var(--danger); }

    table{ width:100%; border-collapse:separate; border-spacing:0; overflow:hidden;
      border-radius:14px; border:1px solid rgba(255,255,255,.10); background: rgba(0,0,0,.12); }
    thead th{ text-align:left; font-size:12px; color:var(--muted); padding:10px 10px;
      border-bottom:1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); position:sticky; top:0; }
    tbody td{ padding:9px 10px; border-bottom:1px solid rgba(255,255,255,.06); vertical-align:top; font-size:13px; }
    tbody tr:last-child td{ border-bottom:none; }
    .num{ text-align:right; font-variant-numeric: tabular-nums; }

    .hint{ color:var(--muted); font-size:12px; margin-top:8px; line-height:1.5; }
    .status{ margin-top:8px; font-size:12px; line-height:1.5; color:var(--muted);
      padding:10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.08); background: rgba(0,0,0,.18); }
    .status.ok{ color: rgba(77,212,172,.95); }
    .status.warn{ color: rgba(255,107,107,.95); }

    .chk { width:18px; height:18px; accent-color: var(--accent); }
    .stickyActions { display:flex gap:10px; align-items:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>乾燥剤 在庫管理</h1>
        <p class="sub">チェックした行だけまとめて削除できます（Googleスプレッドシートから削除）。</p>
      </div>
      <div class="right stickyActions">
        <button id="btnReload" class="btn-ghost">最新を読み込み</button>
        <button id="btnDeleteSelected" class="btn-danger">チェック削除</button>
        <label style="font-size:12px; color:var(--muted); display:flex; gap:8px; align-items:center;">
        表示
        <select id="viewFilter" style="min-width:140px;"></select>
        </label>

      </div>
    </header>

    <div class="card">
      <div class="toolbar">
        <div class="left">
          <label>委託者
            <select id="person"></select>
          </label>
          <label>日付
            <input id="fDate" type="date" />
          </label>
	  <label>お客さま氏名
            <input id="cName" type="text" placeholder="例：山田 太郎" style="min-width:180px;" />
          </label>
　　　　　<label>電話番号
 　　　　　 <input id="cPhone" type="text" inputmode="tel" placeholder="例：090-1234-5678" style="min-width:170px;" />
　　　　　</label>
　　　　　<label>都道府県
 　　　　　 <select id="cPref" style="min-width:160px;"></select>
　　　　　</label>
　　　　　<label>住所（市区町村以降）
  　　　　　<input id="cAddr" type="text" placeholder="例：奈良市○○町1-2-3" style="min-width:260px;" />
　　　　　</label>
          <label>入庫数（個）
            <input id="fIn" type="number" min="0" value="0" />
          </label>
          <label>出庫数（個）
            <input id="fOut" type="number" min="0" value="0" />
          </label>
          <label>備考
            <input id="fNote" type="text" placeholder="例：1箱 / 伝票No" style="min-width:180px;" />
          </label>
          <button id="btnAdd">追加して共有保存</button>
        </div>
      </div>

      <div class="grid">
        <div>
          <div class="hint">
            ルール：入庫と出庫はどちらか一方だけ入力。箱なら入庫に30など。<br />
            削除：一覧のチェックを入れて「チェック削除」。
          </div>
          <div id="status" class="status">待機中</div>
        </div>

        <div>
          <div class="summary">
            <div class="pill">
              <div class="k">総入庫（個）</div>
              <div id="sumIn" class="v">0</div>
            </div>
            <div class="pill">
              <div class="k">総出庫（個）</div>
              <div id="sumOut" class="v">0</div>
            </div>
            <div class="pill">
              <div class="k">差引（入庫−出庫）（個）</div>
              <div id="diff" class="v ok">0</div>
            </div>
          </div>
        </div>
      </div>

      <h2 id="listTitle" style="margin:18px 0 10px; font-size:16px;">一覧（全員分）</h2>
      <table>
        <thead>
          <tr>
            <th style="width:56px;">
              <input id="chkAll" class="chk" type="checkbox" title="全選択/解除">
            </th>
            <th style="width:110px;">委託者</th>
            <th style="width:120px;">日付</th>
            <th>氏名/電話/住所</th>
            <th style="width:160px;">お客さま氏名</th>
	    <th style="width:160px;">電話番号</th>
            <th>住所</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwgHJ9xLH0i9ouxmQe5Pgy4gpC0jReOQg7msSk04ZTm-frWWLgAa7ogvHP85-eY5EWk/exec";
  const PEOPLE = ["委託者A","委託者B","委託者C","委託者D","委託者E"];
  const PREFS = [
  "北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県",
  "茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県",
  "新潟県","富山県","石川県","福井県","山梨県","長野県",
  "岐阜県","静岡県","愛知県","三重県",
  "滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県",
  "鳥取県","島根県","岡山県","広島県","山口県",
  "徳島県","香川県","愛媛県","高知県",
  "福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県",
  "沖縄県"
];

  const $ = (id)=>document.getElementById(id);

  let currentRows = [];
  let allRows = [];
  let selectedIds = new Set();

  function todayISO(){
    const d=new Date();
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${dd}`;
  }
  function toInt(v){ const n=Number(v); return Number.isFinite(n)?Math.trunc(n):0; }
  function esc(s){
    return String(s)
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }
  function setStatus(text, type=""){
    const el = $("status");
    el.classList.remove("ok","warn");
    if(type) el.classList.add(type);
    el.textContent = text;
  }
  function uuid(){
    return (crypto?.randomUUID?.() || ("id-"+Math.random().toString(16).slice(2)));
  }

  const CLIENT_ID_KEY="desiccant_client_id";
  let clientId = localStorage.getItem(CLIENT_ID_KEY);
  if(!clientId){ clientId=uuid(); localStorage.setItem(CLIENT_ID_KEY, clientId); }

 function validate(date, inQty, outQty, cName, cPhone, cPref, cAddr){
  if(!date) return false;

  const i = toInt(inQty);
  const o = toInt(outQty);

  // 入庫と出庫はどちらか一方だけ
  if((i === 0 && o === 0) || (i > 0 && o > 0)) return false;
  if(i < 0 || o < 0) return false;

  // 出庫のときだけ、お客さま情報必須
  if(o > 0){
    if(!cName || !cPhone || !cPref || !cAddr) return false;
  }
  return true;
}

  async function apiGet(){
    const res = await fetch(WEB_APP_URL, { method:"GET" });
    return await res.json();
  }
  async function apiPost(payload){
  const res = await fetch(WEB_APP_URL, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });

  // まず本文をテキストで受け取る（JSONじゃない時もある）
  const text = await res.text();
  let data = null;
  try { data = JSON.parse(text); } catch(e) {}

  // HTTPが失敗してる場合もわかるように返す
  if(!res.ok){
    return { ok:false, error:`HTTP ${res.status}`, detail:text };
  }

  // JSONとして返ってきていればそれを返す
  return data || { ok:false, error:"Invalid JSON", detail:text };
}


  // ✅ これを外に出す（グローバル関数）
  function applyFilterAndRender(){
    const v = $("viewFilter").value; // "ALL" または 委託者名
    $("listTitle").textContent = (v === "ALL") ? "一覧（全員分）" : "一覧（" + v + "）";
    const filtered = (v === "ALL")
      ? allRows
      : allRows.filter(r => r.person === v);

    // 表示対象が変わったら、存在しない選択は外す
    const idSet = new Set(filtered.map(r => r.rowId));
    selectedIds = new Set([...selectedIds].filter(id => idSet.has(id)));

    render(filtered);
  }

  function render(rows){
    // 新しい順（ts）
    rows = [...rows].sort((a,b)=> (a.ts < b.ts ? 1 : a.ts > b.ts ? -1 : 0));
    currentRows = rows;

    let sumIn=0,sumOut=0;
    for(const r of rows){
      sumIn += toInt(r.inQty);
      sumOut += toInt(r.outQty);
    }
    $("sumIn").textContent = sumIn;
    $("sumOut").textContent = sumOut;

    const diff = sumIn - sumOut;
    const diffEl = $("diff");
    diffEl.textContent = diff;
    diffEl.classList.remove("ok","warn");
    diffEl.classList.add(diff >= 0 ? "ok" : "warn");

    const tb = $("tbody");
    tb.innerHTML = "";
    for(const r of rows){
      const id = r.rowId;
      const checked = selectedIds.has(id) ? "checked" : "";
      const tr=document.createElement("tr");
      tr.innerHTML = `
  <td><input class="chk rowChk" type="checkbox" data-id="${esc(id)}" ${checked}></td>
  <td>${esc(r.person)}</td>
  <td>${esc(r.date)}</td>
  <td>${esc(r.cName || "")}</td>
  <td>${esc(r.cPhone || "")}</td>
  <td>${esc(addrFull)}</td>
  <td class="num">${toInt(r.inQty)||""}</td>
  <td class="num">${toInt(r.outQty)||""}</td>
  <td class="muted">${esc(r.ts||"")}</td>
`;
      tb.appendChild(tr);
    }
    syncChkAll();
  }

  function syncChkAll(){
    const allIds = currentRows.map(r=>r.rowId).filter(Boolean);
    if(allIds.length === 0){
      $("chkAll").checked = false;
      $("chkAll").indeterminate = false;
      return;
    }
    let checkedCount = 0;
    for(const id of allIds) if(selectedIds.has(id)) checkedCount++;

    if(checkedCount === 0){
      $("chkAll").checked = false;
      $("chkAll").indeterminate = false;
    } else if(checkedCount === allIds.length){
      $("chkAll").checked = true;
      $("chkAll").indeterminate = false;
    } else {
      $("chkAll").checked = false;
      $("chkAll").indeterminate = true;
    }
  }

  async function reload(){
    setStatus("読み込み中…");
    try{
      const data = await apiGet();
      if(!data.ok){
        setStatus("読み込み失敗（Webアプリ設定/URLを確認）", "warn");
        return;
      }
      allRows = (data.rows || []);
      applyFilterAndRender();
      setStatus("最新を表示しました。", "ok");
    }catch(e){
      setStatus("読み込み失敗（ネットワーク/URL/権限）", "warn");
    }
  }

  async function add(){
  const person = $("person").value;
  const date = $("fDate").value;

  const inQty = $("fIn").value;
  const outQty = $("fOut").value;

  const cName = $("cName").value.trim();
  const cPhone = $("cPhone").value.trim();
  const cPref = $("cPref").value;
  const cAddr = $("cAddr").value.trim();

  if(!validate(date, inQty, outQty, cName, cPhone, cPref, cAddr)){
    setStatus("入力エラー：日付必須、入庫/出庫はどちらか一方。出庫時は氏名/電話/住所必須。", "warn");
    return;
  }

  setStatus("共有保存中…");
  try{
    const rowId = uuid();
    const res = await apiPost({
      rowId,
      person,
      date,
      inQty: toInt(inQty),
      outQty: toInt(outQty),
      cName,
      cPhone,
      cPref,
      cAddr,
      clientId
    });

    if(!res.ok){
  setStatus("保存失敗：" + (res.error || "不明") + (res.detail ? (" / " + res.detail) : ""), "warn");
  return;
}


    // ✅ 保存後クリア
    $("fIn").value = 0;
    $("fOut").value = 0;
    $("cName").value = "";
    $("cPhone").value = "";
    $("cPref").value = "";
    $("cAddr").value = "";

    setStatus("保存しました。最新を読み込みます…");
    await reload();

  }catch(e){
    setStatus("保存失敗（ネットワーク/URL/権限）", "warn");
  }
}


  async function deleteSelected(){
    const ids = [...selectedIds];
    if(ids.length === 0){
      setStatus("削除する行が選ばれていません。", "warn");
      return;
    }
    if(!confirm(`チェックした ${ids.length} 件を削除します。よろしいですか？`)) return;

    setStatus("削除中…");
    try{
      const res = await apiPost({ action:"delete", ids });
      if(!res.ok){
        setStatus("削除失敗（権限/設定）", "warn");
        return;
      }
      selectedIds.clear();
      $("chkAll").checked = false;
      $("chkAll").indeterminate = false;
      setStatus("削除しました。最新を読み込みます…");
      await reload();
    }catch(e){
      setStatus("削除失敗（ネットワーク/URL/権限）", "warn");
    }
  }

  function init(){
    // 委託者プルダウン
    const sel=$("person");
    sel.innerHTML = "";
    for(const p of PEOPLE){
      const o=document.createElement("option");
      o.value=p; o.textContent=p;
      sel.appendChild(o);
    }
    
    // 都道府県プルダウン
    const prefSel = $("cPref");
    prefSel.innerHTML = `<option value="">選択</option>`;
    for(const p of PREFS){
    const o=document.createElement("option");
    o.value=p; o.textContent=p;
    prefSel.appendChild(o);
    }
    
    // 委託者を変えたら、一覧の表示フィルタも同じ人に切り替える
    $("person").addEventListener("change", () => {
    $("viewFilter").value = $("person").value; // ← ここで「全員」じゃなく、その人にする
    $("chkAll").checked = false;
    $("chkAll").indeterminate = false;
    applyFilterAndRender();
    });


    // 表示フィルタ
    const vf = $("viewFilter");
    vf.innerHTML = "";
    const optAll = document.createElement("option");
    optAll.value = "ALL";
    optAll.textContent = "全員";
    vf.appendChild(optAll);

    for(const p of PEOPLE){
      const o=document.createElement("option");
      o.value=p; o.textContent=p;
      vf.appendChild(o);
    }

    vf.addEventListener("change", () => {
      $("chkAll").checked = false;
      $("chkAll").indeterminate = false;
      applyFilterAndRender(); // ✅ グローバルなので呼べる
    });

    $("fDate").value = todayISO();

    const dateInput = $("fDate");
    dateInput.addEventListener("click", ()=>{ if(dateInput.showPicker) dateInput.showPicker(); });
    dateInput.addEventListener("focus", ()=>{ if(dateInput.showPicker) dateInput.showPicker(); });

    $("btnAdd").addEventListener("click", add);
    $("btnReload").addEventListener("click", reload);
    $("btnDeleteSelected").addEventListener("click", deleteSelected);

    $("tbody").addEventListener("change", (e)=>{
      const chk = e.target.closest(".rowChk");
      if(!chk) return;
      const id = chk.dataset.id;
      if(chk.checked) selectedIds.add(id);
      else selectedIds.delete(id);
      syncChkAll();
    });

    $("chkAll").addEventListener("change", ()=>{
      const allIds = currentRows.map(r=>r.rowId).filter(Boolean);
      if($("chkAll").checked){
        allIds.forEach(id => selectedIds.add(id));
      }else{
        allIds.forEach(id => selectedIds.delete(id));
      }
      render(currentRows);
    });

    reload();
  }
  init();
</script>
</body>
</html>
